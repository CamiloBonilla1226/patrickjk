<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="imagenes/logo-optimized.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <title>Patrick's JK — Carta</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<!-- Carta del punto físico (el estanco): se escanea por QR en el local.
     Es solo para mostrar precios — no hay carrito, ficha de producto ni
     barra de navegación inferior, a propósito: nadie compra desde acá, solo
     consulta qué hay y cuánto vale. Usa su propio catálogo
     (js/productos-estanco.js), separado del de domicilio, porque varios
     precios son distintos entre los dos puntos de venta. -->
<body class="estanco-page">
  <div class="app">
    <!-- topbar-apilado: el logo y las categorías van juntos en el mismo
         bloque anclado (position: sticky), como en el panel de admin — así
         el menú de categorías queda siempre visible al hacer scroll (ver
         .topbar-apilado en estilos.css). -->
    <header class="topbar topbar-apilado">
      <span class="logo-text">Patrick's JK</span>

      <div class="subtabs" id="estanco-subtabs"></div>
    </header>

    <main>
      <section class="screen">
        <div class="sec-head">
          <div>
            <div class="eyebrow">Punto físico</div>
            <h1 id="estanco-titulo">Carta</h1>
          </div>
          <img class="sec-head-logo" src="imagenes/logo-optimized.png" alt="Patrick's JK" />
        </div>

        <div id="estanco-lista"></div>
      </section>
    </main>
  </div>

  <script src="js/productos.js"></script>
  <script src="js/productos-estanco.js"></script>
  <script src="js/estanco.js"></script>
</body>
</html>
