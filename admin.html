<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="imagenes/logo-optimized.png" />
  <!-- No se indexa en buscadores: no es una pantalla para clientes, es el
       panel para ofertas y pedidos. No reemplaza tener la URL en secreto —
       ver el comentario de seguridad en js/admin.js. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <title>Patrick's JK — Admin</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="logo-text">Patrick's JK — Admin</span>
    </header>

    <main>
      <section class="screen">
        <div class="sec-head">
          <div>
            <div class="eyebrow">Panel</div>
            <h1 id="admin-titulo-pantalla">Ofertas</h1>
          </div>
        </div>

        <div class="subtabs" id="admin-subtabs">
          <button type="button" class="active" data-seccion="ofertas">Ofertas</button>
          <button type="button" data-seccion="pedidos">Pedidos</button>
        </div>

        <p id="admin-mensaje" class="admin-mensaje" hidden></p>

        <!-- ---- Sección Ofertas ---- -->
        <div id="admin-seccion-ofertas">
          <form id="admin-form" class="entrega-form">
            <div class="entrega-field">
              <label for="admin-oferta-titulo">Título de la oferta</label>
              <input id="admin-oferta-titulo" type="text" placeholder="Ej: Domicilio gratis" maxlength="80" />
            </div>
            <div class="entrega-field">
              <label for="admin-descripcion">Descripción (opcional)</label>
              <input id="admin-descripcion" type="text" placeholder="Ej: En pedidos desde $50.000" maxlength="140" />
            </div>
            <button type="submit" id="admin-publicar-btn" class="entrega-submit-btn">Publicar oferta</button>
          </form>

          <div class="block-title">
            <h2>Ofertas existentes</h2>
          </div>
          <p id="admin-ofertas-vacio" class="ofertas-vacio" hidden>Todavía no has publicado ninguna oferta.</p>
          <div id="admin-ofertas-lista"></div>
        </div>

        <!-- ---- Sección Pedidos ---- -->
        <div id="admin-seccion-pedidos" hidden>
          <p id="admin-pedidos-cargando" class="ofertas-cargando">Cargando pedidos...</p>
          <p id="admin-pedidos-vacio" class="ofertas-vacio" hidden>Todavía no hay pedidos.</p>
          <div id="admin-pedidos-lista"></div>
        </div>
      </section>
    </main>

    <!-- Detalle de un pedido: se abre con el botón "Ver pedido" de cada
         tarjeta (ver js/admin.js). Mismo patrón de modal que #modal-vaciar
         en carrito.html (backdrop + caja, Escape/clic afuera/botón X,
         foco atrapado mientras está abierto). -->
    <div class="modal-backdrop" id="pedido-detalle-modal" hidden>
      <div class="modal-box pedido-detalle-box" id="pedido-detalle-caja" role="dialog" aria-modal="true" aria-labelledby="pedido-detalle-nombre">
        <div class="pedido-detalle-top">
          <h3 class="modal-titulo" id="pedido-detalle-nombre"></h3>
          <button type="button" class="pedido-detalle-cerrar" id="pedido-detalle-cerrar" aria-label="Cerrar">✕</button>
        </div>
        <p class="pedido-detalle-meta" id="pedido-detalle-meta"></p>
        <p class="pedido-fecha" id="pedido-detalle-fecha"></p>
        <div class="pedido-premio" id="pedido-detalle-premio" hidden></div>
        <div class="pedido-detalle-productos" id="pedido-detalle-productos"></div>
        <div class="pedido-total">
          <span>Total</span>
          <b id="pedido-detalle-total"></b>
        </div>
      </div>
    </div>
  </div>

  <script src="js/productos.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
