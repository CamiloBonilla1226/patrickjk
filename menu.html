<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="imagenes/logo-optimized.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <title>Patrick's JK — Menú</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="logo-text">Patrick's JK</span>
      <div class="openpill">
        <span class="dot"></span>
        <span class="estado-texto">Abierto</span>
      </div>
    </header>

    <main>
      <section class="screen" id="tab-menu">
        <div class="sec-head">
          <div>
            <div class="eyebrow">Carta</div>
            <h1>Menú</h1>
          </div>
          <img class="sec-head-logo" src="imagenes/logo-optimized.png" alt="Patrick's JK" />
        </div>

        <!-- data-no-swipe: el gesto de deslizar entre categorías (ver
             js/navegacion.js) ignora cualquier arrastre que empiece aquí,
             para no interferir mientras el cliente toca o selecciona texto
             en el buscador. -->
        <div class="search-box" data-no-swipe>
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="M20 20l-4.8-4.8" />
          </svg>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Buscar un producto..."
            aria-label="Buscar un producto"
            maxlength="60"
          />
        </div>

        <div class="subtabs" id="subtabs"></div>

        <div class="catpanel" id="catpanel">
          <div class="cat-count" id="cat-count"></div>
        </div>
      </section>
    </main>

    <!-- Ficha de producto: se abre al tocar una tarjeta del Menú (ver
         js/ficha.js). Es el mismo bloque que hay en index.html — cada
         pantalla que quiera poder abrir la ficha necesita su propia copia
         de este HTML (este proyecto no tiene una forma de compartir un
         trozo de HTML entre archivos sin un build step), pero el
         comportamiento lo maneja un solo archivo de JS. -->
    <div class="ficha-overlay" id="ficha-overlay" hidden>
      <div class="ficha-sheet" id="ficha-sheet" role="dialog" aria-modal="true" aria-labelledby="ficha-nombre">
        <div class="ficha-scroll">
          <div class="ficha-hero" id="ficha-hero">
            <button type="button" class="ficha-close" id="ficha-cerrar" aria-label="Cerrar">✕</button>
            <div class="ficha-cupwrap">
              <img id="ficha-imagen" src="" alt="" loading="lazy" decoding="async" />
            </div>
          </div>
          <div class="ficha-top">
            <h3 id="ficha-nombre"></h3>
            <span class="status" id="ficha-estado"><span class="dot"></span><span id="ficha-estado-texto"></span></span>
          </div>
          <div class="ficha-body">
            <div class="field-label">Categoría</div>
            <p class="ficha-desc" id="ficha-categoria"></p>

            <div class="ficha-group" id="ficha-sabores-grupo" hidden>
              <div class="ficha-group-label">
                <span>Sabor</span>
                <span class="ficha-group-hint" id="ficha-sabor-hint">Elige uno</span>
              </div>
              <div class="ficha-opt-row" id="ficha-opt-row" role="radiogroup" aria-label="Sabor"></div>
            </div>
          </div>
        </div>
        <div class="ficha-footer">
          <div class="ficha-amt">
            <span>Total</span>
            <b id="ficha-precio">$0</b>
          </div>
          <!-- Elige la cantidad ANTES de agregar (empieza en 1) — recién al
               tocar "Agregar al carrito" se suma todo de una vez (ver
               js/ficha.js). -->
          <div class="ficha-qty-controls" id="ficha-qty-controls">
            <button type="button" class="qty-btn" id="ficha-qty-menos" aria-label="Restar una unidad">−</button>
            <span class="qty-value" id="ficha-qty-valor">1</span>
            <button type="button" class="qty-btn" id="ficha-qty-mas" aria-label="Sumar una unidad">+</button>
          </div>
          <button type="button" class="ficha-add-btn" id="ficha-agregar-btn">Agregar al carrito</button>
        </div>
      </div>
    </div>

    <nav class="tabbar">
      <a href="index.html" data-tab="inicio">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 11l9-7 9 7" />
          <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
        </svg>
        <span>Inicio</span>
      </a>
      <a href="menu.html" data-tab="menu">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 6h16M4 12h16M4 18h10" />
        </svg>
        <span>Menú</span>
      </a>
      <a href="ofertas.html" data-tab="ofertas">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20.6 12.3 12.7 20.2a1.5 1.5 0 0 1-2.1 0L3.8 13.4a1.5 1.5 0 0 1 0-2.1l7.9-7.9c.3-.3.7-.5 1.1-.5h6a1.5 1.5 0 0 1 1.5 1.5v6c0 .4-.2.8-.5 1.1Z" />
          <circle cx="15.5" cy="7.5" r="1.2" fill="currentColor" stroke="none" />
        </svg>
        <span>Ofertas</span>
      </a>
      <a href="carrito.html" data-tab="carrito">
        <span class="tab-icon-wrap">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6" />
            <circle cx="9" cy="20" r="1.4" />
            <circle cx="18" cy="20" r="1.4" />
          </svg>
          <span class="tab-badge" id="tab-carrito-badge" hidden>0</span>
        </span>
        <span>Carrito</span>
      </a>
    </nav>
  </div>

  <script>window.PAGINA_ACTUAL = 'menu';</script>
  <script src="js/productos.js"></script>
  <script src="js/carrito.js"></script>
  <script src="js/navegacion.js"></script>
  <script src="js/ficha.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
