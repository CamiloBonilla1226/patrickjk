<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="imagenes/logo-optimized.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <title>Patrick's JK — Menú</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="logo-text">Patrick's JK</span>
      <div class="openpill">
        <span class="dot"></span>
        <span class="estado-texto">Abierto</span>
      </div>
    </header>

    <main>
      <section class="screen" id="tab-menu">
        <div class="sec-head">
          <div>
            <div class="eyebrow">Carta</div>
            <h1>Menú</h1>
          </div>
          <img class="sec-head-logo" src="imagenes/logo-optimized.png" alt="Patrick's JK" />
        </div>

        <div class="search-box">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="10.5" cy="10.5" r="6.5" />
            <path d="M20 20l-4.8-4.8" />
          </svg>
          <input
            type="search"
            id="search-input"
            class="search-input"
            placeholder="Buscar un producto..."
            aria-label="Buscar un producto"
            maxlength="60"
          />
        </div>

        <div class="subtabs" id="subtabs"></div>

        <div class="catpanel" id="catpanel">
          <div class="cat-count" id="cat-count"></div>
        </div>
      </section>
    </main>

    <nav class="tabbar">
      <a href="index.html" data-tab="inicio">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 11l9-7 9 7" />
          <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
        </svg>
        <span>Inicio</span>
      </a>
      <a href="menu.html" data-tab="menu">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 6h16M4 12h16M4 18h10" />
        </svg>
        <span>Menú</span>
      </a>
      <a href="carrito.html" data-tab="carrito">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6" />
          <circle cx="9" cy="20" r="1.4" />
          <circle cx="18" cy="20" r="1.4" />
        </svg>
        <span>Carrito</span>
      </a>
    </nav>
  </div>

  <script>window.PAGINA_ACTUAL = 'menu';</script>
  <script src="js/productos.js"></script>
  <script src="js/navegacion.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
