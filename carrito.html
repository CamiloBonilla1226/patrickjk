<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="imagenes/logo-optimized.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <title>Patrick's JK — Carrito</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="logo-text">Patrick's JK</span>
      <div class="openpill">
        <span class="dot"></span>
        <span class="estado-texto">Abierto</span>
      </div>
    </header>

    <main>
      <!-- El formulario de entrega, la ruleta y el envío por WhatsApp son
           tareas aparte — por eso "Continuar pedido" más abajo no hace
           nada todavía. -->
      <section class="screen" id="tab-carrito">
        <div class="sec-head">
          <div>
            <div class="eyebrow">Tu pedido</div>
            <h1>Carrito</h1>
          </div>
          <img class="sec-head-logo" src="imagenes/logo-optimized.png" alt="Patrick's JK" />
        </div>

        <!-- Uno de estos dos bloques se muestra y el otro se oculta
             (con el atributo "hidden") según si hay o no productos —
             lo decide renderizarCarrito() en js/carrito.js. -->
        <div class="cart-empty" id="carrito-vacio">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6" />
            <circle cx="9" cy="20" r="1.4" />
            <circle cx="18" cy="20" r="1.4" />
          </svg>
          <p>Tu carrito está vacío.<br />Agrega productos desde el Menú para armar tu pedido.</p>
        </div>

        <div id="carrito-contenido" hidden>
          <div id="carrito-lista"></div>

          <div class="cart-total">
            <span>Total</span>
            <b id="carrito-total">$0</b>
          </div>

          <button type="button" id="btn-vaciar-carrito" class="cart-vaciar-btn">
            Vaciar carrito
          </button>

          <button type="button" id="btn-continuar" class="cart-continuar-btn" disabled>
            Continuar pedido (próximamente)
          </button>
        </div>
      </section>
    </main>

    <!-- Modal casero de confirmación para vaciar el carrito (no usa
         confirm() del navegador, que se ve feo y bloquea la página). Está
         oculto por defecto con "hidden" y js/carrito.js lo muestra/oculta. -->
    <div class="modal-backdrop" id="modal-vaciar" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-label="Confirmar vaciar carrito">
        <p>¿Vaciar todo el carrito? Esta acción no se puede deshacer.</p>
        <div class="modal-actions">
          <button type="button" id="modal-cancelar" class="modal-btn-secundario">Cancelar</button>
          <button type="button" id="modal-confirmar" class="modal-btn-principal">Sí, vaciar</button>
        </div>
      </div>
    </div>

    <nav class="tabbar">
      <a href="index.html" data-tab="inicio">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 11l9-7 9 7" />
          <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
        </svg>
        <span>Inicio</span>
      </a>
      <a href="menu.html" data-tab="menu">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 6h16M4 12h16M4 18h10" />
        </svg>
        <span>Menú</span>
      </a>
      <a href="carrito.html" data-tab="carrito">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6" />
          <circle cx="9" cy="20" r="1.4" />
          <circle cx="18" cy="20" r="1.4" />
        </svg>
        <span>Carrito</span>
      </a>
    </nav>
  </div>

  <script>window.PAGINA_ACTUAL = 'carrito';</script>
  <script src="js/carrito.js"></script>
  <script src="js/navegacion.js"></script>
</body>
</html>
