<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" type="image/png" href="imagenes/logo-optimized.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <title>Patrick's JK — Ofertas</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <span class="logo-text">Patrick's JK</span>
      <div class="openpill">
        <span class="dot"></span>
        <span class="estado-texto">Abierto</span>
      </div>
    </header>

    <main>
      <section class="screen" id="tab-ofertas">
        <div class="sec-head">
          <div>
            <div class="eyebrow">Promociones</div>
            <h1>Ofertas</h1>
          </div>
          <img class="sec-head-logo" src="imagenes/logo-optimized.png" alt="Patrick's JK" />
        </div>

        <p class="ofertas-cargando" id="ofertas-cargando">Cargando ofertas...</p>
        <p class="ofertas-vacio" id="ofertas-vacio" hidden>Por ahora no hay ofertas activas. Vuelve pronto.</p>
        <div id="ofertas-lista"></div>
      </section>
    </main>

    <nav class="tabbar">
      <a href="index.html" data-tab="inicio">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 11l9-7 9 7" />
          <path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" />
        </svg>
        <span>Inicio</span>
      </a>
      <a href="menu.html" data-tab="menu">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 6h16M4 12h16M4 18h10" />
        </svg>
        <span>Menú</span>
      </a>
      <a href="ofertas.html" data-tab="ofertas">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20.6 12.3 12.7 20.2a1.5 1.5 0 0 1-2.1 0L3.8 13.4a1.5 1.5 0 0 1 0-2.1l7.9-7.9c.3-.3.7-.5 1.1-.5h6a1.5 1.5 0 0 1 1.5 1.5v6c0 .4-.2.8-.5 1.1Z" />
          <circle cx="15.5" cy="7.5" r="1.2" fill="currentColor" stroke="none" />
        </svg>
        <span>Ofertas</span>
      </a>
      <a href="carrito.html" data-tab="carrito">
        <span class="tab-icon-wrap">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M3 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.6a2 2 0 0 0 2-1.6L21 8H6" />
            <circle cx="9" cy="20" r="1.4" />
            <circle cx="18" cy="20" r="1.4" />
          </svg>
          <span class="tab-badge" id="tab-carrito-badge" hidden>0</span>
        </span>
        <span>Carrito</span>
      </a>
    </nav>
  </div>

  <script>window.PAGINA_ACTUAL = 'ofertas';</script>
  <script src="js/navegacion.js"></script>
  <script type="module" src="js/ofertas.js"></script>
</body>
</html>
